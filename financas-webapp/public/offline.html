<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Você está offline — Finanças</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1117;
        color: #a0a8c0;
        font-family: 'Inter', system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
      }
      .icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      h1 {
        color: #e8eaf6;
        font-size: 1.4rem;
        margin-bottom: 8px;
      }
      p {
        margin-bottom: 20px;
        line-height: 1.6;
      }
      button {
        background: #6c63ff;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button:hover {
        background: #8078ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>Você está sem conexão</h1>
      <p>
        Não foi possível carregar esta página e nenhum dado ficou salvo em cache.
        Verifique sua conexão com a internet e tente novamente.
      </p>
      <button onclick="window.location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
